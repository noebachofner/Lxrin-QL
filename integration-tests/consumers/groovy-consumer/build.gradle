plugins {
    id 'java'
    id 'ch.lxrin.ql.codegen' version '3.1.0'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

lxrinQl {
    packageName = 'com.example.blog.db'
    schemas = ['public']
    stripTablePrefixes = ['blog_']
    tableConstants = [blog_authors: 'AUTHORS']
    entityNames = [blog_posts: 'Post']
    foreignKeyNames = [blog_posts_reviewer_id_fkey: 'FK_REVIEWER']
    enumMappings = [blog_status: 'com.example.blog.Status']
    excludes = ['tmp_.*']
    generateJavadoc = false
    schemaSource = 'snapshot'
    snapshotFile = layout.projectDirectory.file('src/main/lxrinql/schema.json')
    forcedType 'blog_authors', 'id', 'uuid', 'com.example.blog.AuthorId', 'com.example.blog.BlogTypes.AUTHOR_ID'
    forcedType 'blog_posts', 'author_id|reviewer_id', 'uuid', 'com.example.blog.AuthorId', 'com.example.blog.BlogTypes.AUTHOR_ID'
    database {
        image = 'postgres:17-alpine'
        flywayMigrations.from('src/main/resources/db/migration')
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
