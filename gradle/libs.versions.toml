[versions]
junit = "6.1.3"
mockito = "5.20.0"
postgresql = "42.7.13"
testcontainers = "2.0.5"
flyway = "13.8.0"
archunit = "1.5.0"
spring-boot = "4.1.1"
jackson3 = "3.2.3"
micrometer = "1.17.1"
maven = "3.9.16"
maven-plugin-annotations = "3.16.0"
vanniktech = "0.37.0"
plugin-publish = "2.2.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-jdbc" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
micrometer-observation = { module = "io.micrometer:micrometer-observation", version.ref = "micrometer" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-annotations" }
vanniktech-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech" }
plugin-publish-plugin = { module = "com.gradle.publish:plugin-publish-plugin", version.ref = "plugin-publish" }
